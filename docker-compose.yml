services: 

  redis:
    image: redis:7-alpine
    container_name: redisSaturday
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mongo:

    image: mongo:7
    container_name: mongoSaturday
    ports:
      - "27017:27017"
    environment:
      MONGO_INIT_DATABSE: mydatabase
    volumes:
      - mongo_data:/data/db

# To persist data, we define named volumes for Redis and MongoDB
volumes:
  redis_data:
  mongo_data: